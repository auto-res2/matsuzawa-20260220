[project]
name = "matsuzawa-20260220"
version = "0.1.0"
description = "Chain-of-Thought reasoning with Selective Falsification-Weighted Self-Consistency"
requires-python = ">=3.11"
dependencies = [
    "hydra-core>=1.3.2",
    "wandb>=0.16.0",
    "openai>=1.12.0",
    "datasets>=2.16.0",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "scikit-learn>=1.4.0",
    "tqdm>=4.66.0",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# [VALIDATOR FIX - Attempt 1]
# [PROBLEM]: Hatch build fails - "Unable to determine which files to ship inside the wheel"
# [CAUSE]: No package directory matching project name (matsuzawa_20260220) exists, and no build configuration specified
# [FIX]: Added tool.hatch.build.targets.wheel configuration to specify src directory as the package source
#
# [OLD CODE]:
# (no hatch configuration section)
#
# [NEW CODE]:
[tool.hatch.build.targets.wheel]
packages = ["src"]
